name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: Lint, type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      # The same script a developer runs. CI used to call svelte-check directly
      # because `npm run check` was gated on `wrangler types --check`, which
      # could not pass on a machine that had already built; that divergence is
      # why the broken script went unnoticed for so long.
      - name: Type-check (svelte-check)
        run: npm run check

      # The component project drives a real Chromium, so the binary has to be
      # here before the tests run. Only chromium — the suite pins one browser.
      - name: Install Chromium for component tests
        run: npx playwright install --with-deps chromium

      - name: Unit tests (Vitest)
        run: npm run test:unit -- --run

  deploy:
    name: Deploy to Cloudflare
    # Only after the quality gate passes, and never from a pull request — a PR
    # from a fork would otherwise be able to publish to production.
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Lets GitHub show the live URL on the deployment, and gives somewhere to
    # attach a required reviewer later if this should stop being automatic.
    environment:
      name: production
      url: https://nextsode.cloudils.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # No `command:` — the action's default `deploy` picks up wrangler.jsonc.
          # Runtime secrets (TMDB, database, Google OAuth) already live in
          # Cloudflare and are deliberately not managed from here.
          packageManager: npm
